[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trade"
version = "0.1.0"
description = "AI-assisted trading project."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sami" }]
dependencies = ["ibapi>=9.81.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
